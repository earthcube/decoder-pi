    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const mLayer = L.layerGroup();
    const pLayer = L.layerGroup();
    manufacturers.forEach(m => {
      L.circleMarker([m.lat, m.lon], {
        radius: 5, color: '#1d4ed8', fillColor: '#3b82f6', fillOpacity: 0.85, weight: 1
      }).bindPopup('<b>' + m.name.replace(/</g,'') + '</b><br/>' + (m.city || '') + '<br/>SUDOKN manufacturer')
        .addTo(mLayer);
    });
    places.forEach(p => {
      L.circleMarker([p.lat, p.lon], {
        radius: 4, color: '#166534', fillColor: '#22c55e', fillOpacity: 0.7, weight: 1
      }).bindPopup('<b>' + p.name.replace(/</g,'') + '</b><br/>Geoconnex / GNIS place')
        .addTo(pLayer);
    });
    mLayer.addTo(map);
    pLayer.addTo(map);
    L.control.layers(null, {
      'SUDOKN manufacturers (607)': mLayer,
      'Geoconnex GNIS places (sample of 250 points)': pLayer
    }).addTo(map);
    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<b>OKN resources in Iowa</b><br/>'
        + '<span class="dot" style="background:#3b82f6"></span>SUDOKN manufacturers<br/>'
        + '<span class="dot" style="background:#22c55e"></span>Geoconnex GNIS (sample)';
      return div;
    };
    legend.addTo(map);
  </script>
